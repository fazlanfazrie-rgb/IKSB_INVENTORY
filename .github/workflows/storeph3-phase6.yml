name: STOREPH3 Phase 6 Golden Gate

on:
  push:
    branches: [main, phase6-flutter-golden]
  pull_request:
    branches: [main]

jobs:
  golden:
    name: Flutter Golden Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/golden_engine_test.dart

  android:
    name: Android Build
    needs: golden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android .
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: STOREPH3-android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows Build
    needs: golden
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter create --platforms=windows .
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: STOREPH3-windows
          path: build/windows/x64/runner/Release/
