name: TranX_Store Android Golden Build

on:
  push:
    branches: [main, phase6-flutter-golden, tranx-store-app]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  golden:
    name: Flutter Analyze and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android,windows --project-name tranx_store .
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test

  android:
    name: TranX_Store Android APK
    needs: golden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android --project-name tranx_store .
      - run: rm -f test/widget_test.dart
      - name: Force Android compileSdk 36
        shell: bash
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          grep -n 'compileSdk' android/app/build.gradle.kts
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: TranX_Store-android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: TranX_Store Windows Build
    needs: golden
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter create --platforms=windows --project-name tranx_store .
      - run: Remove-Item -Force -ErrorAction SilentlyContinue test/widget_test.dart
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: TranX_Store-windows
          path: build/windows/x64/runner/Release/
